name: Dependency review

# Blocks a pull request that adds a dependency with a known high-severity vulnerability, or under a
# license that couldn't be combined with GPL-2.0-or-later.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense, GPL-2.0-or-later
          # A test-only package whose metadata names no license.
          allow-dependencies-licenses: pkg:nuget/NetArchTest.Rules
