name: Secret scan

# GeoGuessr session cookies and Discord tokens must never reach this public repository.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan the whole history
        run: >
          docker run --rm --network none -v "$PWD:/repo:ro"
          zricethezav/gitleaks:v8.24.3
          git --redact --no-banner /repo
